name: Apply Infernal Skewer v0.5.7 collisions
on:
  push:
    paths:
      - '.github/patch_v057.py'
      - '.github/workflows/apply-v057.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch game
        run: python .github/patch_v057.py
      - name: Syntax check
        run: node --check src/game.js
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'Obefree'
          git config user.email 'obefree1@gmail.com'
          git add index.html src/game.js
          git commit -m 'Add solid collisions for hog grill walls and pillars'
          git push
