name: Apply hog push-to-wall gameplay
on:
  push:
    paths:
      - '.github/patch_hog_push.py'
      - '.github/workflows/apply-hog-push.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch game
        run: python .github/patch_hog_push.py
      - name: Syntax check
        run: node --check src/game.js
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'Obefree'
          git config user.email 'obefree1@gmail.com'
          git add src/game.js
          git commit -m 'Simplify Mega Hog push-to-wall meat loop'
          git push
