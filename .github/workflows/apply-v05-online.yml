name: Apply Infernal Skewer v0.5 online patch
on:
  push:
    paths:
      - '.github/workflows/apply-v05-online.yml'
      - '.github/patch_v05.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/patch_v05.py
      - name: Syntax check
        run: node --check src/game.js
      - name: Commit patched client
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js
          git diff --cached --quiet || git commit -m 'Add online arena and mobile auto-turn controls'
          git push
