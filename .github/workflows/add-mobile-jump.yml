name: Add mobile jump binding
on:
  push:
    paths:
      - '.github/workflows/add-mobile-jump.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile jump
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game.js')
          s=p.read_text()
          s=s.replace("const stabButton = document.querySelector('#stabButton');\nconst dropButton", "const stabButton = document.querySelector('#stabButton');\nconst jumpButton = document.querySelector('#jumpButton');\nconst dropButton", 1)
          s=s.replace("bindMobileButton(stabButton, thrust);\nbindMobileButton(dropButton", "bindMobileButton(stabButton, thrust);\nbindMobileButton(jumpButton, () => {\n  if (player.grounded) {\n    player.velocityY = JUMP_SPEED;\n    player.grounded = false;\n  }\n});\nbindMobileButton(dropButton", 1)
          p.write_text(s)
          PY
          node --check src/game.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game.js
          git commit -m "Bind jump button for mobile FPS"
          git push
